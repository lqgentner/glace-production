# Alps-wide LRW composites, mean aggregation. `year` is not set here: pass it as
# an override, e.g. `process-composites.py config/lrw-alps.yml year=2023`.
scope: alps-total
# The window is read from config/windows/{window}.yml; every config naming the same
# window composites over the same days, whatever its scope.
window: alps-total
method: lrw
polarizations: [VV, VH]
mode: IW
baseline_days: 12
pixel_size_m: 10
glacier_buffer_m: 250
simplify_m: 20
aggregation: mean
clip_max_resolution: 5.0
write_qa: true

compression:
  products:
    compress: zstd
    zstd_level: 1
    predictor: 3

  composites:
    default:         {compress: lerc_zstd, max_z_error: 1.0e-5}
    COH_LRW:         {max_z_error: 1.0e-4}
    RTC_LRW_QA-CQM:  {max_z_error: 1.0e-3}
    COH_LRW_QA-CQM:  {max_z_error: 1.0e-3}
    RTC_LRW_QA-NUM:  {max_z_error: 0}
    COH_LRW_QA-NUM:  {max_z_error: 0}

dem:
  source: dem/glo30-alps_ellipsoid.tif
  name: Copernicus GLO-30, WGS 84 ellipsoidal heights
  nodata: -32768.0
  apply_egm: false

dirs:
  base_dir: alps-total/{year}
  # Composed by s1bursts 0.9.
  comp_dir: alps-total/{year}/s1-comp

backscatter:
  multilook: [5, 1]
  dem_oversampling: 1.0
  additional_overlap: 0.2
  replace_zeros_with_nan: true
  grid_spacing: 10.0
  img_resampling: BILINEAR_INTERPOLATION
  dem_resampling: BILINEAR_INTERPOLATION
  align_to_standard_grid: true

coherence:
  window: [35, 7]
  subtract_flat_earth_phase: true
  subtract_topographic_phase: true
  replace_zeros_with_nan: true
  grid_spacing: 10.0
  img_resampling: BILINEAR_INTERPOLATION
  dem_resampling: BILINEAR_INTERPOLATION
  align_to_standard_grid: true
  correct_coherence_bias: false
  remove_local_phase_ramp: false
