[project]
name = "glace-production"
description = "Production pipeline of GLACE, Sentinel-1 coherence and backscatter composites of the European Alps"
authors = [
  { name="Luis Gentner", email="luis.gentner@geo.uzh.ch" },
]
readme = "README.md"
requires-python = ">=3.13"
license.file = "LICENSE"
# Use git tags for versioning
dynamic = ["version"]
dependencies = [
    "affine",
    "earthengine-api>=1.6.0",
    "freezebase[s3]>=0.11,<0.12",
    "geopandas>=1.1",
    "joblib>=1.4",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "odc-geo>=0.5",
    "omegaconf>=2.3",
    "pandas>=2.3",
    "pillow",
    "pyarrow",  # parquet engine behind pandas read_parquet/to_parquet
    "pydantic>=2",
    "pydantic-settings>=2.13.1",
    "pyproj>=3.5",
    "pyyaml>=6.0",
    "rasterio>=1.4.3",
    "requests",
    "s1bursts>=0.9,<0.10",
    "scikit-learn>=1.6",
    "scipy",
    "shapely>=2",
    "tenacity>=9.1.2",
    "universal-pathlib>=0.2.6",
]


[dependency-groups]
deploy = [
    "ansible",
    "openstacksdk",
    "python-openstackclient",
]
notebooks = [
    # Only plotting.py and the paper notebooks touch these; the pipeline the
    # prod image runs imports none of them. cartopy also resolves
    # as an sdist, which the compiler-free prod image cannot build.
    "cartopy",
    "cmcrameri>=1.9",
    "matplotlib-inline",
    "ipykernel",  # Quarto's jupyter engine executes the .qmd notebooks with it
    "nbclient",  # Quarto's jupyter engine imports it to execute .qmd notebooks
    "nbformat>=5.10.4",
    # pipeline-flowchart/export-flowchart.py resets the draw.io PDF page; 2.x adds
    # layout analysis on onnxruntime, which the page box does not need.
    "pymupdf>=1.26,<2",
]
dev = [
    "pandas-stubs",
    "pyrefly>=1.2.0",
    "pytest>=9.1.1",
    "ruff>=0.16",
    # scipy ships no annotations for ndimage; without the stubs pyrefly reads
    # distance_transform_edt as returning the full overload union.
    "scipy-stubs",
    "types-geopandas",
    "types-requests",
]

[build-system]
# Require hatch-vcs alongside hatchling to enable Git tag versioning
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# Use the git version to set the version of the package
[tool.hatch.version]
source = "vcs"

[tool.ruff]
line-length = 99
src = ["src"]
# The Python cells of the Quarto notebooks are formatted like Markdown code blocks;
# the linter does not read Markdown, so they are formatted only.
extension = { qmd = "markdown" }

[tool.ruff.lint]
extend-select = [
    "E",    # Pycodestyle errors (style issues)
    "W",    # Pycodestyle warnings (style issues)
    "C90",  # McCabe - complexity metric for functions
    "I",    # isort - import ordering checks
    "N",    # PEP8 Naming - naming conventions
    "D",    # Pydocstyle - docstring formatting
    "UP",   # Pyupgrade - upgrades syntax to newer Python versions
    "ANN",  # Flake8-annotations - enforces type annotation style
    "ASYNC",# Flake8-async - checks async/await usage
    "S",    # Flake8-bandit - security issues
    "FBT",  # Flake8-boolean-trap - potential pitfalls with booleans
    "B",    # Flake8-bugbear - common bug patterns
    "A",    # Flake8-builtins - misuse of Python built-in names
    "COM",  # Flake8-commas - trailing/comma issues
    "C4",   # Flake8-comprehensions - best practices in comprehensions
    "EM",   # Flake8-errmsg - error message style
    "EXE",  # Flake8-executable - executable file checks
    "ISC",  # Flake8-implicit-str-concat - warns on implicit string concatenation
    "ICN",  # Flake8-import-conventions - enforces conventional import aliases
    "LOG",  # Flake8-logging - proper logging usage
    "G",    # Flake8-logging-format - logging format string issues
    "INP",  # Flake8-no-pep420 - warns against non-PEP420 namespace usage
    "PYI",  # Flake8-pyi - checks for type stub (.pyi) consistency
    "PT",   # Flake8-pytest-style - pytest best practices
    "Q",    # Flake8-quotes - enforces quote style consistency
    "RSE",  # Flake8-raise - proper raise statement usage
    "RET",  # Flake8-return - return statement issues
    "SLF",  # Flake8-self - flags instance methods that don't use self
    "SLOT", # Flake8-slots - suggests use of __slots__ where appropriate
    "SIM",  # Flake8-simplify - code simplification hints
    "TID",  # Flake8-tidy-imports - enforces specific import styles
    "TC",   # Flake8-type-checking - proper import of typing in type checks
    "ARG",  # Flake8-unused-arguments - flags unused function arguments
    "PTH",  # Flake8-use-pathlib - encourages pathlib over os.path
    "TD",   # Flake8-todos - flags TODO comments
    "FIX",  # Flake8-fixme - flags FIXME comments
    "PD",   # Pandas-vet - checks pandas-specific code practices
    "PGH",  # Pygrep-hooks - custom grep hooks for linting
    "PL",   # Pylint - integration with Pylint conventions
    "TRY",  # Tryceratops - try/except usage suggestions
    "NPY",  # NumPy-specific rules - ensures NumPy coding standards
    "PERF", # Perflint - performance-related checks
    "FURB", # Refurb - rules for code refurbishment
    "RUF",  # Ruff-specific rules - additional Ruff checks
]

ignore = [
    "ANN003",   # flake8-annotations - Missing type annotations for **kwargs
    "ANN401",   # Dynamically typed expressions (typing.Any) are disallowed in `value`
    "COM812",   # Trailing-comma rule that conflicts with the formatter
    "PLR0913",  # Pylint - Too many arguments
    "PLR0917",  # Pylint - Too many positional arguments
                # Same judgment as PLR0913 above: the raster and compositing APIs
                # take many optional parameters and are called by keyword.
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.flake8-annotations]
suppress-dummy-args = false

[tool.ruff.lint.extend-per-file-ignores]
# Helper modules beside notebooks are imported from the notebook directory, not a package
"notebooks/**/*.py" = ["INP001"]
"tests/**/*.py" = [
    "S101",     # Allow asserts in tests
    "S105",     # Allow dummy passwords in tests
    "S106",     # Allow dummy passwords passed as arguments in tests
    "D101",     # Test class names are self-documenting
    "D102",     # Test method names are self-documenting
    "D103",     # Test function names are self-documenting
    "FBT",      # Don't care about booleans as positional arguments in tests
    "PLR2004",  # Allow magic values in tests
    "SLF001",   # Allow accesses on "private" class members.
    "TC003",    # Runtime imports of stdlib types are fine in tests
    "INP001",   # pytest collects `tests/` by path; it is not an importable package
]
"scripts/**/*.py" = [
    "INP001",   # scripts/ is a collection of entry points, not a package
    "D103",     # One-off analysis helpers; the module docstring carries the intent
    "S603",     # The subprocess calls run fixed download commands, not user input
    "S607",     # ... and take those tools from PATH, which is what the environment provides
]

[tool.ruff.lint.isort]
known-first-party = ["glace_production"]
force-sort-within-sections = true
required-imports = ["from __future__ import annotations"]

[tool.pyrefly]
project-includes = ["src/glace_production", "tests", "scripts"]
# Repo root, so `tests.*` helper modules resolve the way pytest imports them, and
# notebooks/, whose helper modules the notebooks import by bare name.
search-path = [".", "src", "notebooks"]
# Pin the interpreter to the pixi environment CI installs; left unset, pyrefly
# picks up whatever `.venv` happens to sit next to the project and type-checks
# against a different set of site-packages than the one that runs the code.
python-interpreter = ".pixi/envs/default/bin/python"
preset = "strict"
# Plotting-only packages that live in the `notebooks` group, so the environment
# pyrefly runs against does not have them. Every import of one is lazy or under
# `TYPE_CHECKING`, and they are typed as `Any` here rather than pulling the
# notebook environment into CI.
ignore-missing-imports = [
    "cartopy",
    "cartopy.*",
    "cmcrameri",
    "cmcrameri.*",
    "matplotlib_inline",
    "matplotlib_inline.*",
]

# Monkeypatch stubs give a lambda no context to infer from, so annotating each one
# would add noise without catching anything.
[[tool.pyrefly.sub-config]]
matches = "tests/**"
[tool.pyrefly.sub-config.errors]
implicit-any-lambda = false

# scripts/ holds entry points that thread values through matplotlib, Earth
# Engine and pandas, whose returns are largely untyped. Spelling out the resulting `Any`s there would add noise without
# catching anything, so the implicit-any family is off for scripts alone;
# src/ and tests/ stay fully strict.
[[tool.pyrefly.sub-config]]
matches = "scripts/**"
[tool.pyrefly.sub-config.errors]
implicit-any-empty-container = false
implicit-any-lambda = false
implicit-any-parameter = false
implicit-any-type-argument = false

[tool.pytest.ini_options]
# `pytest` with no argument collects tests/ instead of walking the whole
# repository - scripts/, notebooks/ and the data trees have nothing to collect.
testpaths = ["tests"]

[tool.pixi.workspace]
name = "glace-production"
channels = ["conda-forge", "sarforge"]
platforms = ["win-64", "linux-64", "osx-arm64"]
requires-pixi = ">=0.80"

[tool.pixi.dependencies]
python = ">=3.14.10,<3.15"
esa-snap-s1tbx-gpt = "14.*"

[tool.pixi.pypi-dependencies]
glace-production = { path = ".", editable = true }


[tool.pixi.feature.notebooks.dependencies]
# Renders the .qmd notebooks; not distributed on PyPI
quarto = ">=1.9"

[tool.pixi.feature.notebooks.tasks]
paper = { cmd = "quarto render notebooks", description = "Render the paper notebooks: every number, table and figure of the paper" }

[tool.pixi.feature.deploy.tasks]
fleet = { cmd = "ansible-playbook deploy/fleet.yml -e jobs_file={{ jobs }}", args = ["jobs"], description = "One OpenStack VM per job of a manifest in deploy/ (jobs-lrw.yml: GLACE, jobs-pass.yml: per-pass)" }

[tool.pixi.environments]
# The default environment carries the deploy tools, so Ansible is at hand for the fleet
default = { features = ["dev", "deploy"], solve-group = "default" }
notebooks = { features = ["dev", "deploy", "notebooks"], solve-group = "default" }
deploy = { features = ["deploy"], solve-group = "default" }
# Runtime only: what the container installs
prod = { features = [], solve-group = "default" }

[tool.pixi.activation]
scripts = ["scripts/utils/pixi-activate.sh"]
# rasterio's GDAL searches only the PROJ data in its own wheel, never the grids
# `pyproj sync` downloads, so PROJ fetches the grids a transformation needs (e.g.
# EGM2008 for the DEM height conversion) from cdn.proj.org.
env = { PROJ_NETWORK = "ON" }

[tool.pixi.tasks]
test = "pytest -q"
lint = "ruff check"
format = "ruff format"
format-check = "ruff format --check"
typecheck = "pyrefly check"
check = { depends-on = ["lint", "format-check", "typecheck", "test"] }

# The stages of GLACE, in the order the README runs them. Every stage resumes on
# its own (the composite manifest, the validation stores' recorded configs), so
# no task caches outputs. Paths come from .env and the configs.
dem = { cmd = "python scripts/dem/download-glo30.py --config config/dem/glo30-alps.yml", description = "Download the Copernicus GLO-30 DEM of the Alps, in ellipsoidal heights" }
labels = { cmd = "python scripts/inventories/rasterize-labels.py --source SGI2023 --out-dir $GLACIERS_DATA_DIR/labels/sgi2023", description = "Rasterize the Swiss Glacier Inventory 2023 into yearly label masks" }
snow-window = { cmd = "python scripts/s1-composites/compute-snow-window.py config/lrw-alps.yml year={{ year }}", args = ["year"], description = "Find a year's least snow-covered 90 days (MODIS, Earth Engine)" }
composites = { cmd = "python scripts/s1-composites/process-composites.py config/lrw-alps.yml year={{ year }}", args = ["year"], description = "Download, process and compose one year of GLACE (the fleet runs this per year)" }
composites-pass = { cmd = "python scripts/s1-composites/process-composites.py config/pass-alps.yml year={{ year }}", args = ["year"], description = "Compose one year of the per-pass comparison composites" }
glacier-fractions = { cmd = "python scripts/inventories/derive-glacier-fractions.py --scope alps --perimeter-tiles 2210 --out {{ out }}", args = [{ arg = "out", default = "$GLACIERS_DATA_DIR/glace-alps/tiles/.glacier-fractions.parquet" }], description = "Glacier fraction per tile, read by glace-catalog" }
viewer-inventories = { cmd = "python scripts/inventories/export-inventories.py", description = "Export the inventory overlays of glace-viewer (into ../glace-viewer/data)" }

# Validation (Switzerland, SGI 2023)
locations = { cmd = "python scripts/validation/sample-locations.py config/validation/locations-ch.yml", description = "Sample the validation locations from the label masks" }
global-seasonal-download = { cmd = "python scripts/global-seasonal/download-global-seasonal.py --bbox 5 45 11 48 --products coherence backscatter", description = "Download the Global Seasonal coherence and backscatter over Switzerland" }
global-seasonal = { cmd = "python scripts/global-seasonal/global-seasonal-patches.py --baseline 12 --locations-config config/validation/locations-ch.yml --backscatter", depends-on = ["global-seasonal-download"], description = "Tile the Global Seasonal dataset onto the validation tiles" }
folds = { cmd = "python scripts/validation/make-folds.py --locations-config config/validation/locations-ch.yml --out config/validation/folds-ch.csv", description = "Recompute the committed spatial folds (not part of `validation`)" }
extract = { cmd = "python scripts/validation/extract-samples.py config/validation/datasets/lrw-alps.yml && python scripts/validation/extract-samples.py config/validation/datasets/pass-alps.yml --allow-missing && python scripts/validation/extract-samples.py config/validation/datasets/globalseasonal-ch.yml", description = "Extract the samples of GLACE, the per-pass and the Global Seasonal composites" }
separability = { cmd = "python scripts/validation/compute-separability.py", description = "Separability (AUC, JM) of every layer on the common support" }
crossval = { cmd = "python scripts/validation/run-crossval.py config/validation/runs/ablation.yml", description = "Spatial cross-validation of the random forests" }
metrics = { cmd = "python scripts/validation/compute-metrics.py config/validation/runs/ablation.yml", description = "Scores of the cross-validation, by fold and distance band" }
maps = { cmd = "python scripts/validation/predict-maps.py config/validation/runs/ablation.yml --feature-set all_ctx --model rf --locations-config config/validation/locations-ch.yml --classify && python scripts/validation/build-map-vrt.py config/validation/runs/ablation.yml --feature-set all_ctx --model rf --classified && python scripts/validation/build-label-vrt.py config/validation/locations-ch.yml", description = "Prediction maps and the VRTs the mapping examples read" }
validation = { depends-on = ["locations", "extract", "separability", "crossval", "metrics", "maps"], description = "The validation chain from the locations on (run global-seasonal once before; never runs composites)" }
