[defaults]
# Ansible discovers this file relative to the working directory, not to the
# playbook, so it lives at the repo root: every documented invocation is
# `pixi run -e deploy ansible-playbook deploy/<playbook>.yml` from here.
inventory = deploy/inventory.ini
# One fork per fleet VM: the pre-flight upgrade takes ~13 min per host, so at the
# default of 5 a twelve-job fleet would serialize into three waves of it.
forks = 20
